[project]
name = "toolz"
version = "0.1.0"
description = "LLM-enhanced BM25 tool discovery over a ToolRegistry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s[core]>=0.3.9",
    "dspy>=3.2.1",
    "openai>=2.39.0",
    "python-dotenv>=1.0.0",
    "toolregistry>=0.11.1",
]

[project.optional-dependencies]
benchmark = [
    "datasets>=3.0.0",
    "pytrec-eval>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*unclosed file.*:ResourceWarning",
]
