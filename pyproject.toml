[project]
name = "toolz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s[core]>=0.3.9",
    "dspy>=3.2.1",
    "openai>=2.39.0",
    "toolregistry>=0.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*unclosed file.*:ResourceWarning",
]